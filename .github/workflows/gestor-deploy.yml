name: CADIGITAL — Publicar no GitHub Pages

# Publica o app (PWA) a cada push na branch principal que mexa em gestor/,
# ou manualmente pela aba Actions → "Run workflow".
# Antes, ative em Settings → Pages → Source: "GitHub Actions".
on:
  push:
    paths: ['gestor/**', 'supabase/functions/_shared/**', '.github/workflows/gestor-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Só a branch principal publica (regra padrão do ambiente github-pages)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: gestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build (já conectado ao seu Supabase)
        run: npm run build
        env:
          # Valores PÚBLICOS (o navegador de qualquer visitante os recebe): URL do projeto e chave
          # publishable. Podem ser trocados pelas variáveis VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY.
          # A segurança dos dados vem do login + regras do banco (RLS), não do sigilo destes valores.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://aaxmvsqpanlksfhdfcqv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_yzbx9hVKOaZ95Ecmbzp1cQ_VY-HqV1f' }}
      - name: Conexão com o Supabase embutida?
        run: |
          if ! grep -q 'Supabase não configurado' dist/assets/*.js || ! grep -qE 'https://[a-z0-9]{20}\.supabase\.co' dist/assets/*.js; then
            echo "::error::A URL do Supabase não foi embutida no app."
            exit 1
          fi
          echo "Conexão embutida: $(grep -oE 'https://[a-z0-9]{20}\.supabase\.co' dist/assets/*.js | head -1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gestor/dist
      - id: deployment
        uses: actions/deploy-pages@v4

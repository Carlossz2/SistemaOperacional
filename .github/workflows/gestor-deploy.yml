name: Gestor DR — Publicar no GitHub Pages

# Publica o app (PWA) a cada push na branch principal que mexa em gestor/,
# ou manualmente pela aba Actions → "Run workflow".
# Antes, ative em Settings → Pages → Source: "GitHub Actions".
on:
  push:
    paths: ['gestor/**', '.github/workflows/gestor-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Só a branch principal publica (regra padrão do ambiente github-pages)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: gestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gestor/dist
      - id: deployment
        uses: actions/deploy-pages@v4

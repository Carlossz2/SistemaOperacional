name: Gestor DR — Publicar no GitHub Pages

# Publica o app (PWA) a cada push na branch principal que mexa em gestor/,
# ou manualmente pela aba Actions → "Run workflow".
# Antes, ative em Settings → Pages → Source: "GitHub Actions".
on:
  push:
    paths: ['gestor/**', 'supabase/functions/_shared/**', '.github/workflows/gestor-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Só a branch principal publica (regra padrão do ambiente github-pages)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: gestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build (já conectado ao seu Supabase)
        run: npm run build
        env:
          # aceita tanto em Variables quanto em Secrets (são valores públicos)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Conexão com o Supabase embutida?
        run: |
          if [ -z "$(grep -l 'supabase.co' dist/assets/*.js 2>/dev/null)" ]; then
            echo "::warning::VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY não encontrados: o app vai pedir a conexão na primeira abertura. Cadastre-os em Settings → Secrets and variables → Actions."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gestor/dist
      - id: deployment
        uses: actions/deploy-pages@v4

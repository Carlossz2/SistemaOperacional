name: Gestor DR — Backend (Supabase)

# Testa o banco e as funções a cada alteração. Na branch principal, depois dos testes,
# aplica as migrações e publica as Edge Functions no seu projeto Supabase.
on:
  push:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  sql:
    name: Testes do banco (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run.sh

  functions:
    name: Testes das funções e ponta a ponta
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificação de tipos
        run: deno check supabase/functions/*/index.ts
      - name: Testes dos adaptadores
        run: deno test -A supabase/functions/_shared
      - name: Sobe o mini Supabase (Postgres + PostgREST + funções)
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | sudo tar xJ -C /usr/local/bin
          supabase/tests/stack/start.sh
      - name: Teste de ponta a ponta do backend
        run: |
          export ANON_KEY=$(grep ANON_KEY= /tmp/gateway.log | cut -d= -f2)
          deno test -A supabase/tests/stack/backend.e2e.test.ts
      - if: failure()
        run: tail -50 /tmp/gateway.log /tmp/postgrest.log

  deploy:
    name: Publicar no Supabase
    needs: [sql, functions]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Segredos configurados?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Configure os segredos SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD e SUPABASE_PROJECT_REF (veja gestor/GUIA.md). Deploy pulado."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - if: env.SKIP != '1'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.SKIP != '1'
        name: Aplicar migrações do banco
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
      - if: env.SKIP != '1'
        name: Publicar Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

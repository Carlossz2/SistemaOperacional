name: Gestor DR — CI

on:
  push:
    paths: ['gestor/**', 'supabase/functions/_shared/**', '.github/workflows/gestor-*.yml']
  pull_request:
    paths: ['gestor/**', 'supabase/functions/_shared/**', '.github/workflows/gestor-*.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
